name: "Vermeer CI"

on:
  push:
    branches:
      - master
      - /^release-.*$/
    paths:
      - vermeer/**
      - .github/workflows/vermeer-ci.yml
  pull_request:
    paths:
      - vermeer/**
      - .github/workflows/vermeer-ci.yml

defaults:
  run:
    working-directory: vermeer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vermeer-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('vermeer/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Download Go modules
        run: go mod download

      - name: Download UI assets
        run: ./scripts/download_ui_assets.sh

      - name: Generate embedded assets
        run: cd asset && go generate

      - name: Test deployment credentials and graph initialization failures
        run: |
          go test -race ./apps/auth ./tools/token
          go test -race ./apps/common
          go test -race ./apps/master/workers ./apps/master/services -run 'TestWorkerAvailability'
          go test -race ./apps/master/bl -run 'Test(WorkerAvailability|HugegraphLoadAuthorization)'
          go test -race ./apps/worker -run 'Test(LoadReceivers|RecvVertex|ComputeDispatchCancellation)'
          go test -race ./apps/structure -run 'Test(VertexStore|GraphPropagates|MemoryVertex|HugegraphSchema)'

      - name: Build
        run: CGO_ENABLED=0 go build -o vermeer

      - name: Verify binary exists
        run: test -x vermeer

      - name: Verify release metadata exists
        run: |
          test -f release-docs/LICENSE
          test -f release-docs/NOTICE
          test -d release-docs/licenses

  vermeer-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (dry-run)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vermeer
          push: false
          load: true
          tags: vermeer:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release metadata in image
        run: |
          docker run --rm --entrypoint test vermeer:ci-check -f /go/bin/release-docs/LICENSE
          docker run --rm --entrypoint test vermeer:ci-check -f /go/bin/release-docs/NOTICE
          docker run --rm --entrypoint test vermeer:ci-check -d /go/bin/release-docs/licenses

      - name: Verify native token helper and invalid factor rejection
        run: |
          umask 077
          TOKEN_CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "${TOKEN_CHECK_DIR}"' EXIT
          openssl rand -hex 32 > "${TOKEN_CHECK_DIR}/factor"
          docker run --rm -v "${TOKEN_CHECK_DIR}:/probe" \
            --entrypoint /go/bin/vermeer-token vermeer:ci-check \
            -factor-file /probe/factor -output-file /probe/token \
            -user admin -space '$DEFAULT' -i -quiet \
            > "${TOKEN_CHECK_DIR}/stdout" 2> "${TOKEN_CHECK_DIR}/stderr"
          test -s "${TOKEN_CHECK_DIR}/token"
          test "$(stat -c '%a' "${TOKEN_CHECK_DIR}/token")" = 600
          test ! -s "${TOKEN_CHECK_DIR}/stdout"
          test ! -s "${TOKEN_CHECK_DIR}/stderr"
          if docker run --rm -v "${TOKEN_CHECK_DIR}:/probe" \
            --entrypoint /go/bin/vermeer-token vermeer:ci-check \
            -factor-file /probe/missing -output-file /probe/rejected -quiet \
            > "${TOKEN_CHECK_DIR}/stdout" 2> "${TOKEN_CHECK_DIR}/stderr"; then
            echo 'token generation accepted a missing factor file' >&2
            exit 1
          fi
          test ! -e "${TOKEN_CHECK_DIR}/rejected"
          test ! -s "${TOKEN_CHECK_DIR}/stdout"
          if docker run --rm -e VERMEER_AUTH_TOKEN_FACTOR_FILE=/probe/missing \
            vermeer:ci-check -env=master -auth=token \
            > "${TOKEN_CHECK_DIR}/master-log" 2>&1; then
            echo 'Master accepted a missing factor file' >&2
            exit 1
          fi
          if grep -qF -f "${TOKEN_CHECK_DIR}/factor" "${TOKEN_CHECK_DIR}/master-log"; then
            echo 'Master log exposed the factor' >&2
            exit 1
          fi
          # Exercise the same non-root identity used by the Helm test hook.
          # Keep its synthetic factor and token inside a private writable /tmp directory.
          docker run --rm --user 100:101 --entrypoint /bin/sh vermeer:ci-check -ec '
            umask 077
            token_dir=$(mktemp -d /tmp/vermeer-token.XXXXXX)
            trap '\''rm -rf "${token_dir}"'\'' EXIT
            printf "%s" synthetic-nonroot-test-factor > "${token_dir}/factor"
            test -x /go/bin/app
            /go/bin/vermeer-token -factor-file "${token_dir}/factor" \
              -output-file "${token_dir}/token" -user admin -space '\''$DEFAULT'\'' -i -quiet \
              > "${token_dir}/stdout" 2> "${token_dir}/stderr"
            test -s "${token_dir}/token"
            test "$(stat -c %a "${token_dir}/token")" = 600
            test ! -s "${token_dir}/stdout"
            test ! -s "${token_dir}/stderr"
          '
